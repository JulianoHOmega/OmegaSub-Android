name: omegasub_android
description: OmegaSub Legendas PT-BR para Android
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  http: ^1.3.0
  path: ^1.9.0
  archive: ^4.0.2
  flutter_file_dialog: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/images/omegasub.png
    - assets/catalog/demo.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/omegasub.png
  adaptive_icon_background: '#171b25'
  adaptive_icon_foreground: assets/images/omegasub.png
