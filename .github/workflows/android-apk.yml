name: Compilar OmegaSub Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Python 3.11 para Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Informar caminho do Python ao Gradle
        shell: bash
        run: |
          PYTHON_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          echo "OMEGASUB_BUILD_PYTHON=$PYTHON_EXECUTABLE" >> "$GITHUB_ENV"
          "$PYTHON_EXECUTABLE" --version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar wheel universal srt para Chaquopy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/wheels
          python -m pip wheel --no-deps --wheel-dir native/wheels "srt==3.5.3"
          ls -lh native/wheels/srt-3.5.3-py3-none-any.whl

      - name: Gerar estrutura Android Flutter
        run: flutter create --platforms=android --project-name omegasub_android --org com.omegasub .

      - name: Integrar Python local com Chaquopy
        run: python3 scripts/configure_android.py

      - name: Remover teste padrão gerado pelo Flutter
        run: |
          if [ -f test/widget_test.dart ]; then
            rm test/widget_test.dart
          fi

      - name: Configurar nome e acesso à internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('android:label="omegasub_android"', 'android:label="OmegaSub"')
          p.write_text(s)
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Aplicar ícone OmegaSub
        run: dart run flutter_launcher_icons

      - name: Analisar código
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado nas ferramentas Android do runner"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Atualizar Android compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          path = next((p for p in paths if p.is_file()), None)
          if path is None:
              raise SystemExit('Arquivo Gradle Android não encontrado')

          source = path.read_text()
          if path.suffix == '.kts':
              pattern = r'(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$'
              replacement = r'\g<1>compileSdk = 36'
          else:
              pattern = r'(?m)^(\s*)compileSdkVersion\s*(?:\(\s*)?(?:flutter\.compileSdkVersion|\d+)\s*\)?\s*$'
              replacement = r'\g<1>compileSdkVersion 36'
          updated, count = re.subn(pattern, replacement, source)
          if count != 1:
              raise SystemExit(f'Esperada 1 configuração compileSdk em {path}; encontradas {count}')
          path.write_text(updated)
          print(f'compileSdk atualizado para 36 em {path}')
          PY

      - name: Atualizar compileSdk do plugin file_picker
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json
          import re

          metadata = Path('.flutter-plugins-dependencies')
          if not metadata.exists():
              raise SystemExit('Metadados dos plugins Flutter não encontrados')
          data = json.loads(metadata.read_text())
          plugins = [p for p in data.get('plugins', {}).get('android', []) if p.get('name') == 'file_picker']
          if len(plugins) != 1:
              raise SystemExit(f'Esperado um plugin file_picker Android; encontrados {len(plugins)}')
          base = Path(plugins[0]['path']) / 'android'
          gradle = next((p for p in (base / 'build.gradle', base / 'build.gradle.kts') if p.is_file()), None)
          if gradle is None:
              raise SystemExit(f'Gradle do file_picker não encontrado em {base}')
          source = gradle.read_text()
          pattern = r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=|\s)\s*)(?:flutter\.compileSdkVersion|\d+)(\s*)$'
          updated, count = re.subn(pattern, r'\g<1>36\g<2>', source)
          if count != 1:
              raise SystemExit(f'Não foi possível ajustar compileSdk em {gradle}; ocorrências: {count}')
          gradle.write_text(updated)
          print(f'compileSdk do file_picker atualizado para 36: {gradle}')
          PYCODE

      - name: Compilar APK
        run: flutter build apk --debug

      - name: Nomear OmegaSub.apk
        run: cp build/app/outputs/flutter-apk/app-debug.apk OmegaSub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OmegaSub-Android
          path: OmegaSub.apk
          if-no-files-found: error
