name: Compilar OmegaSub Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android Flutter
        run: flutter create --platforms=android --project-name omegasub_android --org com.omegasub .

      - name: Remover teste padrão gerado pelo Flutter
        run: |
          if [ -f test/widget_test.dart ]; then
            rm test/widget_test.dart
          fi

      - name: Configurar nome e acesso à internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('android:label="omegasub_android"', 'android:label="OmegaSub"')
          p.write_text(s)
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Aplicar ícone OmegaSub
        run: dart run flutter_launcher_icons

      - name: Analisar código
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Atualizar Android compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          path = next((p for p in paths if p.is_file()), None)
          if path is None:
              raise SystemExit('Arquivo Gradle Android não encontrado')

          source = path.read_text()
          if path.suffix == '.kts':
              pattern = r'(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$'
              replacement = r'\g<1>compileSdk = 36'
          else:
              pattern = r'(?m)^(\s*)compileSdkVersion\s*(?:\(\s*)?(?:flutter\.compileSdkVersion|\d+)\s*\)?\s*$'
              replacement = r'\g<1>compileSdkVersion 36'
          updated, count = re.subn(pattern, replacement, source)
          if count != 1:
              raise SystemExit(f'Esperada 1 configuração compileSdk em {path}; encontradas {count}')
          path.write_text(updated)
          print(f'compileSdk atualizado para 36 em {path}')
          PY

      - name: Compilar APK
        run: flutter build apk --debug

      - name: Nomear OmegaSub.apk
        run: cp build/app/outputs/flutter-apk/app-debug.apk OmegaSub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OmegaSub-Android
          path: OmegaSub.apk
          if-no-files-found: error
